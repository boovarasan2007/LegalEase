{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0">Extracted Document Text</h4>
            <div class="text-muted small">{{ doc['filename'] }}</div>
        </div>
        <a href="{{ url_for('dashboard', doc_id=doc['id']) }}" class="btn btn-outline-primary btn-sm rounded-pill px-3">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4">
        <pre class="bg-light p-4 rounded-3 text-secondary font-monospace" style="white-space: pre-wrap; font-size: 0.85rem; max-height: 700px; overflow-y: auto;">
{{ doc['extracted_text'] }}
        </pre>
    </div>
</div>
{% endblock %}
